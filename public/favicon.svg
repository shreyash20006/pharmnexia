<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none">
  <defs>
    <linearGradient id="favCapsuleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="48.1%" stop-color="#14E889" />
      <stop offset="100%" stop-color="#0BE879" />
    </linearGradient>
  </defs>

  <!-- Background rounded plate -->
  <rect width="150" height="150" rx="36" fill="#0A0F1D"/>

  <!-- P Letterform -->
  <rect x="20" y="20" width="85" height="38" rx="19" fill="#FFFFFF"/>
  <rect x="20" y="20" width="32" height="96" rx="16" fill="#FFFFFF"/>
  <path d="M 48 58 H 78 C 96 58, 102 70, 102 84 C 102 100, 88 106, 68 106 H 48" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Green Split Capsule (at 25deg) -->
  <g transform="translate(37, 92) rotate(25)">
    <rect x="-16" y="-28" width="32" height="56" rx="16" fill="url(#favCapsuleGrad)"/>
    <line x1="-16" y1="-1" x2="16" y2="-1" stroke="#087A52" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- Medical Cross (#10E879) -->
  <g transform="translate(85, 12)">
    <rect x="0" y="16" width="50" height="18" rx="8" fill="#10E879"/>
    <rect x="16" y="0" width="18" height="50" rx="8" fill="#10E879"/>
  </g>
</svg>