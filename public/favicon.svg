<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pnx-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A8"/>
      <stop offset="100%" stop-color="#00D084"/>
    </linearGradient>
    <linearGradient id="pnx-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1535"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#pnx-dark-grad)" stroke="rgba(0, 208, 132, 0.35)" stroke-width="2"/>
  <!-- Pharmacy cross nexus with connected nodes -->
  <path d="M50 20V80" stroke="url(#pnx-green-grad)" stroke-width="8" stroke-linecap="round"/>
  <path d="M20 50H80" stroke="url(#pnx-green-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Orbiting network connection arc -->
  <circle cx="50" cy="50" r="30" stroke="#00D084" stroke-width="3" stroke-dasharray="6 8" opacity="0.8"/>
  <!-- Nexus node spheres -->
  <circle cx="50" cy="20" r="6" fill="#00E5A8"/>
  <circle cx="50" cy="80" r="6" fill="#00D084"/>
  <circle cx="20" cy="50" r="6" fill="#00E5A8"/>
  <circle cx="80" cy="50" r="6" fill="#00D084"/>
  <!-- Central core glow -->
  <circle cx="50" cy="50" r="9" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="4" fill="#00A86B"/>
</svg>